name: flipFinder code validation

on:
  push:
    paths:
      - ".github/workflows/code-validation.yml"
      - "flipfinder/**"
      - "main.py"
      - "config.yaml"
      - "tests/**"
      - "worker/**"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q main.py flipfinder
      - run: python -m pytest -q

  worker-tests:
    name: Cloudflare Worker unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
